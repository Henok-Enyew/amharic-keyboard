[project]
name = "amharic-ibus"
version = "1.1.0"
description = "Amharic phonetic IBus engine for Linux (SERA / GFF)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
  { name = "Henok Enyew", email = "henokenyew86@gmail.com" },
]
keywords = ["amharic", "ibus", "ime", "ethiopia", "fidel", "sera"]
dependencies = []

[project.urls]
Homepage = "https://henokenyew.me"
Repository = "https://github.com/Henok-Enyew/amharic-keyboard"

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.pytest.ini_options]
testpaths = ["engine/tests"]
pythonpath = ["engine"]
